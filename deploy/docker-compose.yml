name: agent-team-backend

services:
  postgres:
    image: postgres:17-alpine
    security_opt:
      - seccomp:unconfined
    environment:
      POSTGRES_DB: agent_team
      POSTGRES_USER: agent_team
      POSTGRES_PASSWORD: agent_team
    ports:
      - "54329:5432"
    volumes:
      - agent-team-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_team -d agent_team"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - agent-team-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: services/chat-api/Dockerfile
    env_file:
      - ../.env.backend.local
    environment:
      DATABASE_URL: postgres://agent_team:agent_team@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
    command: ["node", "services/chat-api/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: services/chat-api/Dockerfile
    env_file:
      - ../.env.backend.local
    environment:
      DATABASE_URL: postgres://agent_team:agent_team@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
    ports:
      - "8790:8790"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox-worker:
    build:
      context: ..
      dockerfile: services/chat-api/Dockerfile
    env_file:
      - ../.env.backend.local
    environment:
      DATABASE_URL: postgres://agent_team:agent_team@postgres:5432/agent_team
      REDIS_URL: redis://redis:6379
    command: ["node", "services/chat-api/dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    image: node:24-bookworm-slim
    working_dir: /app
    env_file:
      - ../.env.gateway.local
    command: ["node", "gateway/server.mjs"]
    ports:
      - "8787:8787"
    volumes:
      - ../gateway:/app/gateway:ro
    restart: unless-stopped

volumes:
  agent-team-postgres:
  agent-team-redis:
